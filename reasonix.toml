[permissions]
allow = ["Bash=cd /d/project/go/authPlatform && go build -o authPlatform.exe . && ./authPlatform.exe > server.log 2>&1 &\nsleep 3 && cat server.log", "Bash=cd /d/project/go/authPlatform && DB_PASS=root ./authPlatform.exe > server.log 2>&1 &\nsleep 3; cat server.log", "Bash=cd /d/project/go/authPlatform && echo '-- 正确登录:' && RESP=$(curl -s -X POST http://127.0.0.1:8080/api/admin/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"admin123\"}') && echo \"$RESP\" && TOKEN=$(echo \"$RESP\" | sed 's/.*\"token\":\"\\([^\"]*\\)\".*/\\1/') && echo '-- 带 token 调 /me:' && curl -s http://127.0.0.1:8080/api/admin/me -H \"Authorization: Bearer $TOKEN\" && echo && echo '-- 错误密码:' && curl -s -X POST http://127.0.0.1:8080/api/admin/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"wrong\"}' && echo && echo '-- 无 token 调 /me:' && curl -s http://127.0.0.1:8080/api/admin/me && echo && echo '-- 篡改 token:' && curl -s http://127.0.0.1:8080/api/admin/me -H \"Authorization: Bearer ${TOKEN}x\"", "Bash=netstat -ano | grep ':8080' | grep LISTENING; PID=$(netstat -ano | grep ':8080' | grep LISTENING | awk '{print $5}' | head -1); echo \"PID=$PID\"; if [ -n \"$PID\" ]; then taskkill //PID $PID //F; fi; sleep 1; netstat -ano | grep ':8080' | grep LISTENING || echo PORT_FREE", "Bash=cd /d/project/go/authPlatform && sleep 2 && cat server.log && echo === && echo '-- 健康检查:' && curl -s http://127.0.0.1:8080/api/health && echo && echo '-- 静态页:' && curl -s -o /dev/null -w 'GET / -> %{http_code}\\n' http://127.0.0.1:8080/ && echo '-- 登录:' && RESP=$(curl -s -X POST http://127.0.0.1:8080/api/admin/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"admin123\"}') && echo \"$RESP\" && TOKEN=$(echo \"$RESP\" | sed 's/.*\"token\":\"\\([^\"]*\\)\".*/\\1/') && echo '-- me:' && curl -s http://127.0.0.1:8080/api/admin/me -H \"Authorization: Bearer $TOKEN\" && echo && echo '-- 错误密码:' && curl -s -X POST http://127.0.0.1:8080/api/admin/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"wrong\"}' && echo && echo '-- 篡改 token:' && curl -s http://127.0.0.1:8080/api/admin/me -H \"Authorization: Bearer ${TOKEN}x\"", "Bash=cd /d/project/go/authPlatform && sleep 2 && cat server.log && echo === && TOKEN=$(curl -s -X POST http://127.0.0.1:8080/api/admin/login -H 'Content-Type: application/json' -d '{\"username\":\"admin\",\"password\":\"admin123\"}' | sed 's/.*\"token\":\"\\([^\"]*\\)\".*/\\1/') && echo \"TOKEN 获取成功\" && echo '-- 1 用户列表:' && curl -s http://127.0.0.1:8080/api/admin/users -H \"Authorization: Bearer $TOKEN\" && echo && echo '-- 2 创建用户 alice:' && curl -s -X POST http://127.0.0.1:8080/api/admin/users -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json' -d '{\"username\":\"alice\",\"password\":\"alice1234\",\"nickname\":\"爱丽丝\"}' && echo && echo '-- 3 弱密码拒绝:' && curl -s -X POST http://127.0.0.1:8080/api/admin/users -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json' -d '{\"username\":\"bob\",\"password\":\"123\"}' && echo && echo '-- 4 重复用户名:' && curl -s -X POST http://127.0.0.1:8080/api/admin/users -H \"Authorization: Bearer $TOKEN\" -H 'Content-Type: application/json' -d '{\"username\":\"alice\",\"password\":\"alice1234\"}'"]
