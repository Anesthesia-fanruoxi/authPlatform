[package]
name = "authplatform-desktop"
version = "0.1.0"
description = "authPlatform 桌面令牌登录客户端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tiny_http = "0.12"
dirs = "6"

[lib]
name = "authplatform_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
